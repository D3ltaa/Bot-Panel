<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-wrap { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; gap:16px; }
        .login-card { background:var(--card-primary); border-radius:20px; padding:36px 32px; display:flex; flex-direction:column; gap:14px; width:300px; }
        .login-card h2 { color:var(--text-heading); margin:0; font-size:20px; }
        .login-card p { color:var(--text-muted); margin:0; font-size:13px; }
        .login-card input { background:var(--card-secondary); border:1px solid var(--border); border-radius:10px; padding:12px 14px; color:var(--text-heading); font-size:16px; font-family:var(--font); letter-spacing:0.15em; outline:none; width:100%; box-sizing:border-box; }
        .login-card input:focus { border-color:var(--surface); }
        .login-card button { background:#4CAF50; color:#fff; border:none; border-radius:10px; padding:12px; font-size:15px; font-weight:700; font-family:var(--font); cursor:pointer; }
        .login-card button:hover { background:#43a047; }
        .watermark { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); font-size:12px; font-weight:600; color:var(--text-muted); letter-spacing:0.05em; pointer-events:none; z-index:9999; white-space:nowrap; }
        .error { display:none; color:#f44336 !important; }
        .error.visible { display:block; }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="login-card">
            <h2>Panel Access</h2>
            <p>Enter the one-time password shown in your server console.</p>
            <form method="POST" action="/auth">
                <input type="password" name="otp" placeholder="Password" autofocus autocomplete="off" />
                <br><br>
                <p class="error">Incorrect password.</p>
                <button type="submit">Unlock</button>
            </form>
        </div>
    </div>
    <div class="watermark">© Copyrights D3ltaa</div>
    <script>
        if (new URLSearchParams(location.search).get('error')) {
            document.querySelector('.error').classList.add('visible');
        }
    </script>
</body>
</html>
